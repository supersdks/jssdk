name: promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact immutable candidate version to promote
        required: true
        type: string
      source_commit:
        description: Internal source commit already merged and attested
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  latest:
    runs-on: ubuntu-latest
    environment: promotion
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.0.1
      - name: Verify exact candidate, provenance and immutable registry bytes
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          test "$(node -p 'require("./package.json").version')" = "$VERSION"
          test "$(npm view @supersdk/jssdk dist-tags.candidate)" = "$VERSION"
          node scripts/verify-native-attestation.mjs --provenance PUBLIC_PROVENANCE.json --source-commit "$SOURCE_COMMIT"
          node scripts/verify-release.mjs --published
      - name: Promote only after all exact-artifact checks pass
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          npm dist-tag add "@supersdk/jssdk@$VERSION" latest
          npm dist-tag rm @supersdk/jssdk candidate
          test "$(npm view @supersdk/jssdk dist-tags.latest)" = "$VERSION"
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release view "v$VERSION" || gh release create "v$VERSION" --verify-tag --generate-notes
